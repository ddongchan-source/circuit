<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로우폴리 포뮬러 테스트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
  /* Samsung Sharp Sans: fonts 폴더의 글꼴 파일을 씁니다. 한글은 이 글꼴에 없어 IBM Plex Sans KR로 이어 씁니다. */
  @font-face { font-family: "Samsung Sharp Sans"; src: url("fonts/samsungsharpsans.otf") format("opentype"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Samsung Sharp Sans"; src: url("fonts/samsungsharpsans-medium.otf") format("opentype"); font-weight: 500 600; font-display: swap; }
  @font-face { font-family: "Samsung Sharp Sans"; src: url("fonts/samsungsharpsans-bold.otf") format("opentype"); font-weight: 700 900; font-display: swap; }
  /* 화면 위 UI는 모두 한 가지 재질을 씁니다: 반투명 어두운 유리, 얇은 테두리, 둥근 모서리, 포인트는 핑크 하나. */
  :root {
    color-scheme: dark;
    --ground: #5f9a4a;
    --ink: #191b18;
    --glow: #fa243c;
    --pit: var(--glow);
    --material: rgba(30, 30, 32, .72);
    --material-strong: rgba(30, 30, 32, .86);
    --hairline: inset 0 0 0 .5px rgba(255, 255, 255, .12);
    --lift: 0 12px 32px rgba(0, 0, 0, .28);
    --blur: blur(28px) saturate(170%);
    --fill: rgba(120, 120, 128, .24);
    --fill-strong: rgba(120, 120, 128, .36);
    --text: #ffffff;
    --label2: rgba(235, 235, 245, .62);
    --label3: rgba(235, 235, 245, .32);
    --radius: 14px;
    --font-body: "Samsung Sharp Sans", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-gauge: var(--font-body);
  }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ground); color: var(--text); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  .hud { position: fixed; z-index: 10; pointer-events: none; }
  [hidden] { display: none !important; }
  .glass { background: var(--material); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--hairline), var(--lift); border-radius: var(--radius); }
  button { -webkit-tap-highlight-color: transparent; }

  /* 구간 환영 문구와 시작 문구 */
  #zone {
    top: 25%; left: 50%; transform: translate(-50%, 12px);
    font: 700 clamp(24px, 5vw, 64px)/1.1 var(--font-body); letter-spacing: -.02em;
    color: #ffffff; text-shadow: 0 2px 18px rgba(0, 0, 0, .35); white-space: nowrap;
    opacity: 0; transition: opacity .7s, transform .7s;
  }
  #zone.show { opacity: 1; transform: translate(-50%, 0); }
  #zone.ink { color: var(--glow); text-shadow: none; }
  #iris { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 30; pointer-events: none; background: #09090b; }
  #title {
    z-index: 31; left: 50%; bottom: 10%; transform: translateX(-50%); color: #ffffff; white-space: nowrap;
    font: 700 clamp(22px, 4vw, 48px)/1.1 var(--font-body); letter-spacing: -.02em;
    animation: titlePulse 2.2s ease-in-out infinite;
  }
  @keyframes titlePulse { 50% { opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { #title { animation: none; } }

  /* 키 안내 */
  #keys {
    left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: grid; gap: 7px; padding: 12px 14px; font-size: 12px; transition: opacity .3s;
  }
  #keys.off { opacity: 0; }
  .keyRow { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  .keyCaps { display: flex; gap: 4px; min-width: 66px; }
  .keyRow kbd {
    min-width: 12px; padding: 3px 7px; border-radius: 6px; background: var(--fill-strong); color: #ffffff;
    font: 600 11px/1.3 var(--font-body); text-align: center;
  }
  .keyRow span { color: var(--label2); }
  @media (pointer: coarse) { #keys { display: none; } }

  /* 상호작용 안내 말풍선과 주유 진행 */
  #fuelTag { left: 0; top: 0; z-index: 9; will-change: transform; }
  #fuelPrompt {
    pointer-events: auto; cursor: pointer; padding: 8px 14px; border: 0; border-radius: 999px;
    background: var(--material-strong); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--hairline), var(--lift);
    color: #ffffff; font: 600 13px var(--font-body); white-space: nowrap;
  }
  #fuelPrompt:not(.waiting)::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 8px; border-radius: 50%; background: var(--glow); vertical-align: 1px; }
  #fuelPrompt.waiting { color: var(--label2); }
  #fuelPanel {
    display: grid; gap: 8px; width: 168px; padding: 12px 14px; border-radius: var(--radius);
    background: var(--material-strong); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--hairline), var(--lift);
  }
  #fuelHead { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #fuelHead #fuelPercent { color: var(--label2); }
  #fuelBar { height: 4px; overflow: hidden; border-radius: 999px; background: var(--fill-strong); }
  #fuelFill { width: 0; height: 100%; border-radius: 999px; background: var(--glow); }

  /* 터치 조작 키 */
  #pad.locked { opacity: .4; }
  #pad {
    display: none;
    left: max(16px, env(safe-area-inset-left, 0px));
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    gap: 8px;
    grid-template-columns: 46px 46px 46px 10px 96px;
    grid-template-rows: 46px 46px;
    grid-template-areas: ". w . . shift" "a s d . space";
  }
  .key {
    pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none;
    display: grid; place-items: center; padding: 0; cursor: pointer; border: 0; border-radius: 12px;
    background: var(--material); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--hairline);
    color: var(--text); font: 600 14px var(--font-body);
  }
  .key small { display: block; font-size: 10px; font-weight: 500; color: var(--label2); }
  .key.on { background: var(--glow); }
  .key.on small { color: #ffffff; }
  [data-input="forward"] { grid-area: w; } [data-input="left"] { grid-area: a; }
  [data-input="back"] { grid-area: s; } [data-input="right"] { grid-area: d; }
  [data-input="boost"] { grid-area: shift; } [data-input="brake"] { grid-area: space; }

  /* 피트 스탑: 우측의 업그레이드 창과 왼쪽으로 펼쳐지는 해석 창 */
  #pit {
    z-index: 12; top: calc(16px + env(safe-area-inset-top, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    width: min(340px, calc(100vw - 32px)); box-sizing: border-box; display: flex; flex-direction: column; padding: 22px 20px 18px;
    border-radius: 20px; pointer-events: auto; opacity: 0; visibility: hidden; transform: translateX(24px); transition: opacity .35s, transform .35s, visibility 0s .35s;
  }
  #pit.show { opacity: 1; visibility: visible; transform: none; transition: opacity .35s, transform .35s; }
  #pitHead { display: grid; gap: 2px; }
  #pitHead span { font: 600 13px var(--font-body); color: var(--label2); }
  #pitHead strong { font: 700 28px/1.1 var(--font-body); letter-spacing: -.02em; }
  #pitSub { margin: 6px 0 0; font-size: 13px; line-height: 1.45; color: var(--label2); }
  #pitRows { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; gap: 2px; margin: 10px 0 0; min-height: 0; }
  .pitRow { display: grid; gap: 10px; padding: 10px 12px; margin: 0 -12px; border-radius: 12px; transition: background .2s; }
  .pitRow:hover { background: rgba(255, 255, 255, .06); }
  .pitName { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
  .pitName div { display: grid; gap: 2px; }
  .pitName strong { font-size: 15px; font-weight: 600; }
  .pitName span { font-size: 12px; color: var(--label2); }
  .pitCount { font: 500 13px/1 var(--font-body); font-style: normal; color: var(--label2); font-variant-numeric: tabular-nums; }
  .pitControl { display: grid; grid-template-columns: 30px 1fr 30px; gap: 12px; align-items: center; }
  .pitButton {
    display: grid; place-items: center; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
    background: var(--fill); color: #ffffff; transition: background .15s, transform .1s;
  }
  .pitButton svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; fill: none; display: block; }
  .pitButton:hover { background: var(--fill-strong); }
  .pitButton:last-child { background: var(--glow); }
  .pitButton:last-child:hover { background: #ff4a5e; }
  .pitButton:active { transform: scale(.92); }
  .pitButton:disabled { opacity: .35; cursor: default; background: var(--fill); }
  .pitCells { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .pitCell { display: block; height: 6px; border-radius: 999px; background: rgba(255, 255, 255, .26); transition: background .25s; }
  .pitCell.on { background: var(--glow); }
  .pitCell.locked { background: rgba(255, 255, 255, .06); }   /* 아직 배우는 중이라 채울 수 없는 칸 */
  .pitToast {
    position: absolute; left: 50%; top: 50%; z-index: 1; padding: 5px 11px; border-radius: 999px; white-space: nowrap; opacity: 0; pointer-events: none;
    background: #ffffff; color: #1c1c1e; font: 600 12px/1 var(--font-body); transform: translate(-50%, -50%); box-shadow: var(--lift);
  }
  .pitToast.show { animation: pitToast 1.6s ease-out both; }
  @keyframes pitToast { 0% { opacity: 0; transform: translate(-50%, -30%); } 15%, 70% { opacity: 1; transform: translate(-50%, -50%); } 100% { opacity: 0; transform: translate(-50%, -50%); } }
  #pitNote {
    z-index: 12; right: calc(max(16px, env(safe-area-inset-right, 0px)) + min(340px, calc(100vw - 32px)) + 12px); width: 260px; padding: 16px 18px;
    box-sizing: border-box; border-radius: 16px; opacity: 0; transform: translateX(8px); transition: opacity .2s, transform .2s;
  }
  #pitNote.show { opacity: 1; transform: none; }
  #pitNote strong { display: block; font-size: 15px; font-weight: 600; }
  #pitNote span { display: block; margin-top: 2px; font-size: 12px; color: var(--label2); }
  #pitNote p { margin: 10px 0 0; font-size: 13px; line-height: 1.6; color: rgba(255, 255, 255, .86); }
  .pitPop {
    position: fixed; left: 0; top: 0; z-index: 11; pointer-events: none; white-space: nowrap; will-change: transform, opacity;
    padding: 6px 12px; border-radius: 999px; background: var(--glow); color: #ffffff; font: 700 15px/1 var(--font-body);
    box-shadow: 0 6px 18px rgba(0, 0, 0, .25);
  }
  body.pit #mini { visibility: hidden; }
  body.pit canvas { cursor: grab; }
  body.pitDrag canvas { cursor: grabbing; }
  @media (max-width: 720px) {
    #pit { top: auto; height: 62vh; left: 12px; right: 12px; width: auto; padding: 16px; }
    #pitNote { left: 12px; right: 12px; width: auto; }
  }

  /* 미니 플레이어 */
  #mini {
    top: calc(16px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    width: min(300px, calc(100vw - 32px)); box-sizing: border-box; display: grid; gap: 10px; padding: 12px; pointer-events: auto;
  }
  #miniTop { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; min-width: 0; }
  #miniCover { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; display: block; box-shadow: 0 4px 12px rgba(0, 0, 0, .3); }
  #miniInfo { min-width: 0; display: grid; gap: 3px; }
  #miniTitle, #miniArtist { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #miniTitle { font-size: 14px; font-weight: 600; }
  #miniArtist { min-height: 16px; font-size: 12px; color: var(--label2); }
  #miniBar { height: 3px; margin-top: 3px; overflow: hidden; border-radius: 999px; background: var(--fill-strong); }
  #miniFill { width: 0; height: 100%; border-radius: 999px; background: #ffffff; }
  #miniControls { display: grid; grid-template-columns: repeat(3, 34px) 18px 1fr; gap: 4px; align-items: center; }
  .miniButton {
    display: grid; place-items: center; width: 34px; height: 34px; padding: 0; border: 0; border-radius: 50%;
    background: transparent; color: #ffffff; cursor: pointer;
  }
  .miniButton:hover { background: var(--fill); }
  .miniButton svg { width: 18px; height: 18px; fill: currentColor; display: block; }
  #miniToggle { background: #ffffff; color: #1c1c1e; }
  #miniToggle:hover { background: rgba(255, 255, 255, .86); }
  #miniIcon { width: 16px; height: 16px; fill: var(--label2); margin-left: 4px; }
  #miniVolume { width: 100%; min-width: 0; margin: 0; accent-color: #ffffff; cursor: pointer; }

  /* 장비 설명 창: 장비에 다가가면 그 장비의 왼쪽이나 오른쪽에 붙어 뜹니다. 위치는 updateGearNote가 매 프레임 정합니다. */
  #gearNote {
    left: 0; top: 0; width: 260px; box-sizing: border-box; display: grid; gap: 4px; padding: 16px 18px; border-radius: 18px;
    opacity: 0; transition: opacity .25s; will-change: transform;
  }
  #gearNote.show { opacity: 1; }
  #gearNote span { font-size: 12px; color: var(--label2); }
  #gearNote strong { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  #gearNote p { margin: 6px 0 0; font-size: 13px; line-height: 1.6; color: rgba(255, 255, 255, .86); }
  #gearNote em { margin-top: 8px; font-style: normal; font-size: 12px; color: var(--label2); }
  #gearNote em.on { color: var(--glow); }
  @media (pointer: coarse) {
    #pad {
      display: grid;
      right: max(16px, env(safe-area-inset-right, 0px));
      grid-template-columns: 64px 64px 1fr 72px 64px;
      grid-template-rows: 58px 58px;
      grid-template-areas: ". . . shift w" "a d . space s";
    }
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/aframe@1.7.1/dist/aframe-master.min.js"></script>
<script>
/* ---------- 튜닝 값: 주행감과 색상은 여기서 조절합니다 ---------- */
const CONFIG = {
  car: {
    wheelbase: 3.0,
    topSpeed: 34,        // m/s, 일반 최고 속도
    boostSpeed: 44,      // m/s, 부스터 최고 속도
    reverseSpeed: 9,
    acceleration: 21,    // m/s²
    boostAcceleration: 38,
    brake: 32,           // S 브레이크
    hardBrake: 62,       // 스페이스 급브레이크
    drag: 0.42,          // 가속 페달을 뗐을 때의 감속
    grip: 7.5,           // 옆 미끄러짐을 잡는 힘
    brakeGrip: 3.2,      // 급브레이크 중에는 낮아져서 차가 미끄러짐
    steerLow: 0.58,      // 저속 최대 조향각(rad)
    steerHigh: 0.105,    // 고속 최대 조향각(rad)
    displayScale: 8.8    // 장난감 크기 세계의 속도를 km/h처럼 보이게 하는 배율
  },
  // 출렁임: stiffness가 높을수록 빠르게 반응하고, damping이 낮을수록 오래 출렁입니다.
  suspension: {
    stiffness: 95,
    damping: 9,
    pitchPerAccel: 0.0028,
    rollPerAccel: 0.0019,
    heavePerAccel: 0.0006,
    maxPitchUp: 0.05,
    maxPitchDown: 0.045,
    maxRoll: 0.06
  },
  camera: { offset: [15, 21, 19], fov: 34, lookAhead: 0.3, speedZoom: 0.28, smoothing: 4.5, minZoom: 0.75, maxZoom: 1.9 },
  // 주유: seconds 동안 잔이 비워지고, carSeconds 동안 차가 바뀌는 모습을 비춥니다.
  // glassShot과 carShot은 [바라볼 높이, 고정 시점에서 돌린 각도, 내려다보는 각도, 거리]입니다.
  fuel: { seconds: 4.2, reach: 5.5, maxSpeed: 2, hintReach: 14, carSeconds: 2.8, swapDelay: 0.9, glassShot: [7, -0.35, 0.4, 44], carShot: [0.8, 0.25, 0.42, 13] },
  hints: { zoneReach: 22, height: 5 },   // F 안내: 이 거리 안으로 다가가면 오브젝트 위에 나타납니다.
  // W와 S를 함께 눌렀을 때: pivotSpeed는 초당 회전량(rad), pivotEase가 낮을수록 천천히 돌기 시작합니다.
  burnout: { pivotSpeed: 1.25, pivotEase: 3.6, spin: 26, squat: 0.03 },
  // 주유 후의 GT: 무겁고 부드러워서 더 크게 출렁이고 코너에서 더 미끄러집니다.
  gt: {
    color: { paint: '#8a4316', roof: '#f0dcb8', glass: '#1c1a1a', chrome: '#d9dde0', dark: '#16130f', lamp: '#ffe8b0' },
    car: {
      wheelbase: 2.76, topSpeed: 28, boostSpeed: 36, reverseSpeed: 8, acceleration: 14, boostAcceleration: 24,
      brake: 26, hardBrake: 44, drag: 0.42, grip: 4.8, brakeGrip: 2.2, steerLow: 0.5, steerHigh: 0.095, displayScale: 8.8
    },
    suspension: {
      stiffness: 55, damping: 5.8, pitchPerAccel: 0.0048, rollPerAccel: 0.0034, heavePerAccel: 0.0015,
      maxPitchUp: 0.08, maxPitchDown: 0.1, maxRoll: 0.1
    }
  },
  color: {
    grass: ['#5f9a4a', '#69a551', '#568f44', '#64a04c'], tree: ['#2f6f38', '#3c8040', '#4b8d42'], trunk: '#6b4a2f',
    rock: '#d9dbd6', track: '#6a6d73', trackLine: '#e6e6df', kerbA: '#f4f4ef', kerbB: '#d3120f', fence: '#c9ccc6',
    gate: '#2f3236', lamp: '#ffc531',
    body: '#d3120f', accent: '#f4f4ef', carbon: '#14151a', tyre: '#191a1e', rim: '#8d9096',
    helmet: '#ffd21f', cone: '#f26a21', crate: '#ffc531', crateAlt: '#f4f4ef'
  },
  // 파우스트 구간: 위스키의 갈색을 밝기별로 나눠 씁니다. edgeX, edgeZ가 구간의 경계입니다.
  faust: {
    edgeX: -34, edgeZ: -12,
    ground: ['#e3cdae', '#d9bf9b', '#d0b28a', '#e9d8bd', '#c9a77c'], tree: ['#b5651d', '#c98a2b', '#8a4a1c'], rock: '#a9744a',
    kerbA: '#f0dcb8', kerbB: '#8a4a1c', oak: '#9a5f2c', oakDark: '#4a2a14', caramel: '#8a4f1f', cream: '#f0dcb8', dirt: '#b4935f', stone: '#b9ad98', pump: '#a8321f',
    amber: '#ffb347', ice: '#ffecef',
    gold: '#c39a4b', copper: '#b8713a', wax: '#18181a', blue: '#2d69c4', clearGlass: '#f5f4ee', cutGlass: '#ffe3e3',
    darkRum: '#431a0a', darkRumGlow: '#2a0d04', whiteRum: '#eaf1f2', cassisGlass: '#1b1030',
    cocktail: '#b5122b', cocktailGlow: '#6e0713', rosemary: '#5f8a4b', rosemaryDark: '#3f6a3a', stem: '#6d5a3c'
  },
  // 노래 구간: 어두운 공연장 분위기. songs의 src에 파일 경로를 넣으면 데모 음 대신 실제 곡이 재생됩니다.
  music: {
    edgeZ: -19, edgeX: 104, maxDb: 12, sliderTravel: 10, loopSeconds: 48, standTop: 5, speakerBow: 0.35,
    lp: { at: [-100, -65], yaw: -0.3, tilt: 0.2, zoneFrom: 14.5, zoneWidth: 14, zoneDepth: 7, spin: 2.1, noteSide: -24, noteFront: 2, noteWidth: 23, armRest: -0.04, armStart: -0.56, armEnd: -0.7, label: '#fbfbf9' },   // LP 플레이어: at은 위치, yaw와 tilt는 카메라 쪽으로 비스듬한 각도, zoneFrom은 앞쪽 글로잉 영역까지의 거리입니다.
    cube: { at: [70, -54], size: 5.2, height: 5.4, turn: 0.75, bob: 0.4 },   // 회전 큐브: at은 위치입니다.
    // 배경음: lofi가 평소에 계속 나오고, 스튜디오 곡이 재생 중이면 쉽니다. level은 곡 대비 음량입니다.

/* ---------- 입력: e.code를 사용해 한글 입력 상태에서도 WASD가 동작합니다 ---------- */
const input = { forward: false, back: false, left: false, right: false, boost: false, brake: false };
const KEYS = {
  KeyW: 'forward', ArrowUp: 'forward', KeyS: 'back', ArrowDown: 'back',
  KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right',
  ShiftLeft: 'boost', ShiftRight: 'boost', Space: 'brake'
};
function setInput(name, value) {
  input[name] = value;
  const key = document.querySelector('.key[data-input="' + name + '"]');
  if (key) key.classList.toggle('on', value);
}
function beginDriving() {
  AUDIO.ensure();
  BGM.start();
  window.focus();
}
// 시작 연출: 대기 화면 → 아무 키나 누르면 트랙 위의 원이 맵 전체로 퍼지며 바로 출발
const INTRO = {
  state: 'title', reveal: -1, centerX: 0, centerZ: 0,

  begin: function () {
    if (this.state !== 'title') return;
    this.state = 'done';
    this.reveal = 0;
    WORLD.locked = false;
    beginDriving();
    document.getElementById('title').hidden = true;
  },
  // R: 처음의 대기 화면으로 돌아갑니다.
  restart: function () {
    this.state = 'title';
    this.reveal = -1;
    WORLD.locked = true;
    Object.keys(input).forEach(function (name) { setInput(name, false); });
    document.getElementById('title').hidden = false;
    document.getElementById('iris').hidden = false;
  },
  // 대기 화면에서 W를 누르면 시작과 동시에 바로 달립니다.
  key: function (e) {
    if (this.state === 'done') return false;
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey || /^F\d+$/.test(e.key)) return true;
    this.begin();
    return !KEYS[e.code];
  },
  // 트랙 위의 원을 화면 좌표로 옮겨, 그 바깥을 검게 칠하고 원 둘레에 흰빛을 그립니다.
  draw: function (camera, radius, ring) {
    const canvas = document.getElementById('iris'), ctx = canvas.getContext('2d');
    const ratio = Math.min(window.devicePixelRatio || 1, 2), w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== Math.round(w * ratio)) canvas.width = Math.round(w * ratio);
    if (canvas.height !== Math.round(h * ratio)) canvas.height = Math.round(h * ratio);
    canvas.style.background = 'transparent';

    ctx.clearRect(0, 0, w, h);

}
function inMusic(x, z) {
  const m = CONFIG.music;

  return !inFaust(x, z) && !inMusic(x, z) && x >= CONFIG.music.edgeX + Math.sin(z * 0.06) * 5 && z < CONFIG.fashion.edgeZ + Math.sin(x * 0.05) * 3;
}
function inPit(x, z) {
  return !inFaust(x, z) && !inMusic(x, z) && !inFashion(x, z) && x >= CONFIG.pit.edgeX && z > CONFIG.pit.edgeZ;
}
function zoneAt(x, z) {
  return inFaust(x, z) ? 'faust' : inMusic(x, z) ? 'music' : inFashion(x, z) ? 'fashion' : inPit(x, z) ? 'pit' : null;
}
function makeMaterial(color, extra) {
  return new THREE.MeshStandardMaterial(Object.assign({ color: color, roughness: 0.72, metalness: 0, flatShading: true }, extra));
}
function addMesh(geometry, material, parent, x, y, z) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(x || 0, y || 0, z || 0);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}
function addBox(w, h, d, material, parent, x, y, z) {
  return addMesh(new THREE.BoxGeometry(w, h, d), material, parent, x, y, z);
}
// 두 점을 잇는 가는 막대. 서스펜션 암과 페어링 지지대에 사용합니다.
function addStrut(a, b, thickness, material, parent) {
  const from = new THREE.Vector3().fromArray(a), to = new THREE.Vector3().fromArray(b);
  const mesh = addBox(thickness, thickness * 0.6, from.distanceTo(to), material, parent);
  mesh.position.copy(from).add(to).multiplyScalar(0.5);
  mesh.lookAt(parent.localToWorld(to.clone()));
  return mesh;
}
// z축을 따라 단면을 이어 붙여 각진 차체를 만듭니다. 단면은 앞(-z)에서 뒤(+z) 순서입니다.
function loft(sections, sides) {
  const rings = sections.map(function (s) {
    const ring = [];
    for (let i = 0; i < sides; i++) {
      const angle = (i + 0.5) / sides * Math.PI * 2;
      ring.push([(s.x || 0) + Math.cos(angle) * s.w / 2, s.y + Math.sin(angle) * s.h / 2, s.z]);
    }
    return ring;
  });
  const positions = [];
  const tri = function (a, b, c) { positions.push.apply(positions, a.concat(b, c)); };
  for (let s = 0; s < rings.length - 1; s++) {
    for (let i = 0; i < sides; i++) {
      const n = (i + 1) % sides;
      const a = rings[s][i], b = rings[s][n], c = rings[s + 1][n], d = rings[s + 1][i];
      tri(a, b, d); tri(b, c, d);
    }
  }
  const first = sections[0], last = sections[sections.length - 1];
  const front = [first.x || 0, first.y, first.z], back = [last.x || 0, last.y, last.z];
  for (let i = 0; i < sides; i++) {
    const n = (i + 1) % sides;
    tri(front, rings[0][n], rings[0][i]);
    tri(back, rings[rings.length - 1][i], rings[rings.length - 1][n]);
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.computeVertexNormals();
  return geometry;
}

  // 도로 차량 공통 부품: 바퀴, 브레이크등, 배기 불꽃을 만들고 차종 정보를 등록합니다.
  finishRoadCar: function (name, parts) {
    const c = CONFIG.color;
    const steerGroups = [], spinGroups = [];
    const tyre = makeMaterial(c.tyre, { roughness: 0.9 }), rim = makeMaterial(parts.rim, { roughness: 0.3 }), hub = makeMaterial(parts.hub);
    parts.wheels.forEach(function (w, index) {
      const steer = new THREE.Group();
      steer.position.set(w[0], parts.radius, w[1]);
      parts.root.add(steer);
      const spin = new THREE.Group();
      steer.add(spin);
      const tyreGeo = new THREE.CylinderGeometry(parts.radius, parts.radius, parts.width, 14);
      tyreGeo.rotateZ(Math.PI / 2);
      addMesh(tyreGeo, tyre, spin);
      const rimGeo = new THREE.CylinderGeometry(parts.radius * 0.7, parts.radius * 0.7, parts.width + 0.02, 14);
      rimGeo.rotateZ(Math.PI / 2);
      addMesh(rimGeo, hub, spin);
      [0, 1, 2, 3, 4].forEach(function (k) {
        addBox(parts.width + 0.05, 0.05, parts.radius * 1.3, rim, spin).rotation.x = k * Math.PI / 5;
      });

      spinGroups.push(spin);
    });
    const flameGeometry = new THREE.ConeGeometry(0.09, 0.8, 7);

      flame.position.set(spot[0], spot[1], spot[2]);
      flame.visible = false;
      parts.body.add(flame);
      return flame;
    });
    parts.root.visible = false;
    this.cars[name] = {
      root: parts.root, body: parts.body, brakeLight: parts.brakeLight, flames: flames, steerGroups: steerGroups, spinGroups: spinGroups,
      spec: Object.assign({ car: CONFIG.roadCars[name].car, suspension: CONFIG.roadCars[name].suspension }, parts.spec)
    };
  },

  // 도로 차량이 아닌 탈것을 등록합니다. 바퀴 대신 animate가 매 프레임 움직임을 만듭니다.

  // 웨스턴: 흰 말과 데님 차림의 기수. 속도에 맞춰 네 다리가 습보로 달립니다.
  buildHorse: function () {
    const c = CONFIG.rides.horse.color, root = new THREE.Group(), body = new THREE.Group(), gait = new THREE.Group();
    this.el.object3D.add(root);
    root.add(body);
    body.add(gait);
    gait.scale.setScalar(0.92);
    const coat = makeMaterial(c.coat, { roughness: 0.55 }), mane = makeMaterial(c.mane), hoof = makeMaterial(c.hoof);
    const blanket = makeMaterial(c.blanket), white = makeMaterial(c.stitch), leather = makeMaterial(c.saddle), eye = makeMaterial(c.hoof);
    addMesh(loft([
      { z: -1.72, w: 0.66, h: 0.76, y: 2.02 }, { z: -1.36, w: 1, h: 1.22, y: 2.04 }, { z: -0.7, w: 1.1, h: 1.3, y: 2.06 }, { z: 0.2, w: 1.02, h: 1.14, y: 2.1 },
      { z: 0.95, w: 1.1, h: 1.26, y: 2.14 }, { z: 1.55, w: 1, h: 1.08, y: 2.18 }, { z: 1.86, w: 0.5, h: 0.54, y: 2.24 }
    ], 8), coat, gait);
    // 목, 갈기, 머리
    const neck = new THREE.Group();
    neck.position.set(0, 2.36, -1.42);
    neck.rotation.x = 0.82;
    gait.add(neck);
    addMesh(loft([{ z: -1.5, w: 0.36, h: 0.56, y: 0 }, { z: -0.75, w: 0.48, h: 0.84, y: 0 }, { z: 0.1, w: 0.68, h: 1.12, y: -0.06 }], 8), coat, neck);
    for (let i = 0; i < 7; i++) addBox(0.12, 0.3, 0.26, mane, neck, 0, 0.32 + i * 0.03, -1.46 + i * 0.25).rotation.x = -0.2;
    const head = new THREE.Group();
    head.position.set(0, 0.02, -1.42);
    head.rotation.x = -1.3;
    neck.add(head);
    addMesh(loft([{ z: -1.02, w: 0.28, h: 0.32, y: -0.05 }, { z: -0.62, w: 0.33, h: 0.4, y: 0 }, { z: -0.02, w: 0.46, h: 0.62, y: 0.03 }, { z: 0.18, w: 0.32, h: 0.36, y: 0.05 }], 8), coat, head);
    [-1, 1].forEach(function (side) {
      addMesh(new THREE.ConeGeometry(0.08, 0.28, 5), coat, head, side * 0.14, 0.42, 0.06).rotation.z = -side * 0.14;
      addBox(0.04, 0.1, 0.12, eye, head, side * 0.22, 0.12, -0.2);
      addBox(0.03, 0.05, 0.05, eye, head, side * 0.13, -0.04, -0.96);
    });
    addBox(0.36, 0.06, 0.06, blanket, head, 0, 0.26, -0.28);
    addBox(0.36, 0.07, 0.06, blanket, head, 0, -0.02, -0.76);
    // 네 다리와 꼬리
    const legs = [[-0.34, -1.22], [0.34, -1.22], [-0.34, 1.38], [0.34, 1.38]].map(function (spot) {
      return limb(gait, spot[0], 1.76, spot[1], 0.8, 0.78, 0.25, 0.12, 0.09, coat, function (tip) {
        addBox(0.24, 0.2, 0.3, hoof, tip, 0, -0.06, -0.02);
      });
    });
    const tail = new THREE.Group();
    tail.position.set(0, 2.5, 1.84);
    gait.add(tail);
    const hair = addMesh(loft([{ z: 0, w: 0.2, h: 0.2, y: 0 }, { z: 0.6, w: 0.3, h: 0.34, y: -0.06 }, { z: 1.25, w: 0.2, h: 0.28, y: -0.14 }, { z: 1.7, w: 0.04, h: 0.08, y: -0.2 }], 6), mane, tail);
    hair.rotation.x = 0;
    // 데님 안장 깔개, 흰 스티치, 가죽 안장, 등자
    addMesh(loft([{ z: -0.72, w: 1.24, h: 1.42, y: 2.1 }, { z: 0.34, w: 1.2, h: 1.32, y: 2.12 }], 8), blanket, gait);
    addBox(1.1, 0.03, 0.05, white, gait, 0, 2.79, -0.66);
    addBox(1.1, 0.03, 0.05, white, gait, 0, 2.79, 0.28);
    addMesh(loft([{ z: -0.48, w: 0.62, h: 0.26, y: 2.9 }, { z: -0.1, w: 0.76, h: 0.16, y: 2.84 }, { z: 0.3, w: 0.72, h: 0.3, y: 2.92 }], 6), leather, gait);
    addMesh(new THREE.CylinderGeometry(0.08, 0.06, 0.26, 6), leather, gait, 0, 3.08, -0.5);
    const rider = makePerson({ top: c.jacket, sleeve: c.jacket, pants: c.jeans, shoe: c.boot, skin: c.skin, hair: c.hair, inner: c.stitch, legs: [0.72, 0.72] });
    rider.group.position.set(0, 3.04, -0.08);
    gait.add(rider.group);
    rider.torso.rotation.x = -0.14;
    addBox(0.62, 0.07, 0.04, makeMaterial(c.jeansDark), rider.torso, 0, 0.3, 0.27);
    // 카우보이모자
    const hat = makeMaterial(c.hat);
    const brim = addMesh(new THREE.CylinderGeometry(0.62, 0.62, 0.05, 10), hat, rider.head, 0, 0.3, 0);
    brim.scale.z = 0.82;
    addMesh(new THREE.CylinderGeometry(0.22, 0.3, 0.32, 8), hat, rider.head, 0, 0.46, 0);
    addBox(0.56, 0.06, 0.48, makeMaterial(c.band), rider.head, 0, 0.34, 0);
    [0, 1].forEach(function (i) {
      const side = i ? 1 : -1, leg = rider.legs[i], arm = rider.arms[i];
      leg.top.rotation.set(-0.44, 0, side * 0.42);
      leg.low.rotation.x = -0.62;
      arm.top.rotation.set(0.82, 0, side * -0.1);
      arm.low.rotation.x = 0.82;
      addBox(0.06, 0.16, 0.34, leather, leg.tip, 0, -0.16, 0);
    });
    // 고삐
    const rein = makeMaterial(c.saddle);
    [-1, 1].forEach(function (side) { addMesh(tubeBetween([side * 0.18, 3.66, -0.92], [side * 0.3, 3.28, -1.86], 0.018), rein, gait); });
    let phase = 0;
    const offsets = [2.8, 3.25, 0, 0.45];
    this.addRide('horse', {
      root: root, body: body, spec: { skidWidth: 0.36, frontAxle: 1.25, noseLength: 2, tailLength: 2, halfWidth: 0.2 },
      animate: function (dt, s) {
        const speed = Math.abs(s.forwardSpeed), run = Math.min(speed / 7, 1);
        phase += dt * (3 + speed * 0.5) * (s.forwardSpeed < -0.2 ? -0.7 : 1) * (speed > 0.2 ? 1 : 0);
        legs.forEach(function (leg, index) {
          const t = phase + offsets[index], rear = index > 1;
          leg.top.rotation.x = run * (rear ? 0.62 : 0.74) * Math.sin(t) + (rear ? -0.04 : 0.02);
          leg.low.rotation.x = -run * 1.05 * Math.max(0, Math.sin(t + 1.1));
        });
        const beat = Math.sin(phase * 1);
        gait.position.y = run * 0.2 * Math.abs(Math.sin(phase));
        gait.rotation.x = run * 0.075 * Math.sin(phase + 0.7);
        neck.rotation.x = 0.82 - run * 0.2 + run * 0.1 * beat;
        tail.rotation.x = 0.28 + run * 0.62 + run * 0.12 * Math.sin(phase * 0.5);
        rider.group.position.y = 3.04 + run * 0.07 * Math.sin(phase + 1.8);
        rider.torso.rotation.x = -0.14 - run * 0.42;
      }
    });
  },

  // 스트릿: 후드집업과 블랙 플레어 데님을 입은 스케이터. 가속할 때 뒷발로 땅을 밉니다.
  buildSkater: function () {
    const c = CONFIG.rides.skater.color, root = new THREE.Group(), body = new THREE.Group();

    root.add(body);
    const deck = makeMaterial(c.deck), grip = makeMaterial(c.grip), truck = makeMaterial(c.truck), wheelMat = makeMaterial(c.wheel);
    addBox(0.82, 0.08, 2, deck, body, 0, 0.36, 0);
    addBox(0.8, 0.02, 2, grip, body, 0, 0.41, 0);
    [-1, 1].forEach(function (side) {
      const kick = addBox(0.74, 0.08, 0.5, deck, body, 0, 0.44, side * 1.17);
      kick.rotation.x = -side * 0.34;
      const tape = addBox(0.72, 0.02, 0.48, grip, body, 0, 0.49, side * 1.16);
      tape.rotation.x = -side * 0.34;
    });
    const steerGroups = [], spinGroups = [];
    [-0.72, 0.72].forEach(function (z, index) {
      const axle = new THREE.Group();
      axle.position.set(0, 0.17, z);
      body.add(axle);
      addBox(0.9, 0.07, 0.1, truck, axle, 0, 0.02, 0);
      addBox(0.2, 0.14, 0.2, truck, axle, 0, 0.1, 0);
      [-1, 1].forEach(function (side) {
        const spin = new THREE.Group();
        spin.position.set(side * 0.47, 0, 0);
        axle.add(spin);
        const wheel = new THREE.CylinderGeometry(0.17, 0.17, 0.16, 10);
        wheel.rotateZ(Math.PI / 2);
        addMesh(wheel, wheelMat, spin);
        addBox(0.18, 0.05, 0.3, truck, spin);
        spinGroups.push(spin);
      });
      if (!index) steerGroups.push(axle);
    });
    const person = makePerson({ top: c.hoodie, sleeve: c.hoodie, pants: c.jeans, shoe: c.shoe, skin: c.skin, hair: c.hair, inner: c.tee, legs: [0.8, 0.8], flare: 0.32 });
    const hipY = 1.5, deckY = 0.42 - hipY + 0.1;
    person.group.position.set(0, hipY, 0.06);
    person.group.rotation.y = -Math.PI / 2;
    body.add(person.group);
    // 후드, 지퍼, 비니
    const hood = makeMaterial(c.hoodieDark);
    addBox(0.78, 0.46, 0.34, hood, person.torso, 0, 1.2, 0.3);
    addBox(0.05, 0.8, 0.02, makeMaterial(c.zip), person.torso, 0, 0.74, -0.285);
    addBox(0.6, 0.18, 0.04, hood, person.torso, 0, 0.42, -0.28);
    addBox(0.52, 0.2, 0.52, makeMaterial(c.beanie), person.head, 0, 0.3, 0);
    person.head.rotation.y = Math.PI / 2 * 0.86;
    person.torso.rotation.y = 0.5;
    const [up, low] = [0.8, 0.8];
    let push = 0, cycle = 0;
    this.addRide('skater', {
      root: root, body: body, steerGroups: steerGroups, spinGroups: spinGroups,
      spec: { skidWidth: 0.42, frontAxle: 0.9, noseLength: 1.4, tailLength: 1.4, halfWidth: 0.2 },
      animate: function (dt, s) {
        const speed = Math.abs(s.forwardSpeed), top = CONFIG.rides.skater.car.topSpeed;
        const pushing = input.forward && !input.back && !input.brake && speed < top * 0.95;
        push += ((pushing ? 1 : 0) - push) * (1 - Math.exp(-7 * dt));
        cycle += dt * (s.boosting ? 8.4 : 5.6);
        const sweep = Math.sin(cycle), lift = Math.max(0, Math.cos(cycle)) * 0.42;
        const footX = 0.52 + (0.42 + sweep * 0.56) * push, footY = deckY + (-1.42 + lift + 0.1 - deckY) * push;
        reachSide(person.legs[0], -0.24, -0.5, deckY, up, low);
        reachSide(person.legs[1], 0.24, footX, footY, up, low);
        person.legs[1].top.rotation.x = -0.3 * push;
        person.group.position.y = hipY - push * (0.1 + Math.abs(sweep) * 0.06);
        person.torso.rotation.z = 0.14 + push * 0.2 + Math.min(speed / top, 1) * 0.08;
        person.arms[0].top.rotation.set(0, 0, -0.95 + sweep * 0.34 * push);
        person.arms[1].top.rotation.set(0, 0, 0.95 + sweep * 0.34 * push);
        person.arms[0].low.rotation.x = 0.32;
        person.arms[1].low.rotation.x = 0.32;
      }
    });
  },

  // 캐주얼: 클래식 자전거와 흰 셔츠, 넥타이, 베이지 코튼 팬츠 차림의 라이더. 다리는 페달을 따라 움직입니다.
  buildBike: function () {
    const c = CONFIG.rides.bike.color, root = new THREE.Group(), body = new THREE.Group();
    this.el.object3D.add(root);
    root.add(body);
    const frame = makeMaterial(c.frame, { roughness: 0.3, metalness: 0.2 }), chrome = makeMaterial(c.chrome, { roughness: 0.25, metalness: 0.5 });
    const tyre = makeMaterial(c.tyre, { roughness: 0.9 }), leather = makeMaterial(c.leather), fender = makeMaterial(c.frame, { roughness: 0.3, side: THREE.DoubleSide });
    const R = 0.86, axleRear = [0, R, 1.02], bb = [0, 0.86, 0.12], seat = [0, 2.02, 0.56], headTop = [0, 2.02, -0.72], headLow = [0, 1.7, -0.82];
    const tube = function (a, b, r, material, parent) { return addMesh(tubeBetween(a, b, r), material || frame, parent || body); };
    tube(bb, seat, 0.055);
    tube(seat, headTop, 0.05);
    tube(headLow, bb, 0.055);
    tube(headTop, headLow, 0.07);
    [-0.1, 0.1].forEach(function (x) {
      tube([x * 0.4, bb[1], bb[2]], [x, axleRear[1], axleRear[2]], 0.03);
      tube([x * 0.4, seat[1] - 0.06, seat[2] - 0.02], [x, axleRear[1], axleRear[2]], 0.03);
    });
    const wheel = function (parent, z) {
      const spin = new THREE.Group();
      spin.position.set(0, R, z);
      parent.add(spin);
      const rim = new THREE.TorusGeometry(R - 0.04, 0.045, 6, 22);
      rim.rotateY(Math.PI / 2);
      addMesh(rim, tyre, spin);
      const inner = new THREE.TorusGeometry(R - 0.11, 0.022, 4, 22);
      inner.rotateY(Math.PI / 2);
      addMesh(inner, chrome, spin);
      for (let i = 0; i < 8; i++) addBox(0.012, (R - 0.1) * 2, 0.022, chrome, spin).rotation.x = i * Math.PI / 8;
      const hub = new THREE.CylinderGeometry(0.07, 0.07, 0.2, 8);
      hub.rotateZ(Math.PI / 2);
      addMesh(hub, chrome, spin);
      const guard = new THREE.TorusGeometry(R + 0.07, 0.06, 4, 12, Math.PI * 0.86);
      guard.rotateY(Math.PI / 2);
      guard.scale(1, 1, 1);
      const cover = addMesh(guard, fender, parent, 0, R, z);
      cover.scale.x = 1.5;
      cover.rotation.x = z > 0 ? -0.5 : 0.3;
      return spin;
    };
    const rearSpin = wheel(body, axleRear[2]);
    const fork = new THREE.Group();
    fork.position.set(0, 0, -1.14);
    body.add(fork);
    const frontSpin = wheel(fork, 0);
    const local = function (p) { return [p[0], p[1], p[2] + 1.14]; };
    [-0.1, 0.1].forEach(function (x) { tube(local([x, headLow[1] - 0.06, headLow[2]]), [x, R, 0], 0.03, frame, fork); });
    tube(local(headLow), local([0, 2.34, -0.68]), 0.035, chrome, fork);
    const barAt = [0.56, 2.4, -0.42], barMid = [0.14, 2.36, -0.74];
    [-1, 1].forEach(function (side) {
      tube(local([0, 2.34, -0.72]), local([side * barMid[0], barMid[1], barMid[2]]), 0.03, chrome, fork);
      tube(local([side * barMid[0], barMid[1], barMid[2]]), local([side * barAt[0], barAt[1], barAt[2]]), 0.03, chrome, fork);
      tube(local([side * barAt[0] * 0.8, barAt[1], barAt[2] - 0.05]), local([side * (barAt[0] + 0.02), barAt[1], barAt[2] + 0.02]), 0.05, leather, fork);
    });
    // 앞 바구니와 가죽 안장
    const basket = makeMaterial(c.basket);
    addBox(0.8, 0.05, 0.56, basket, fork, 0, 1.92, -0.2);
    addBox(0.8, 0.34, 0.04, basket, fork, 0, 2.08, -0.48);
    addBox(0.8, 0.34, 0.04, basket, fork, 0, 2.08, 0.08);
    [-1, 1].forEach(function (side) { addBox(0.04, 0.34, 0.56, basket, fork, side * 0.4, 2.08, -0.2); });
    tube([0, 2.02, 0.56], [0, 2.14, 0.6], 0.035, chrome);
    addMesh(loft([{ z: -0.34, w: 0.16, h: 0.08, y: 2.18 }, { z: 0.14, w: 0.46, h: 0.12, y: 2.2 }, { z: 0.36, w: 0.5, h: 0.1, y: 2.22 }], 6), leather, body).position.z = 0.56;
    const ring = new THREE.CylinderGeometry(0.28, 0.28, 0.05, 14);
    ring.rotateZ(Math.PI / 2);
    addMesh(ring, chrome, body, 0.14, bb[1], bb[2]);
    [-1, 1].forEach(function (side) { tube([0.14, bb[1] + side * 0.26, bb[2]], [0.14, axleRear[1] + side * 0.1, axleRear[2]], 0.015, makeMaterial(c.tyre)); });
    const crank = new THREE.Group();
    crank.position.set(0, bb[1], bb[2]);
    body.add(crank);
    const pedals = [];
    [-1, 1].forEach(function (side) {
      addBox(0.05, 0.42, 0.06, chrome, crank, side * 0.2, side * 0.2, 0);
      const pedal = addBox(0.3, 0.04, 0.16, makeMaterial(c.tyre), crank, side * 0.34, side * 0.38, 0);
      pedals.push(pedal);
    });
    const hips = [0, 2.42, 0.62];
    const person = makePerson({ top: c.shirt, sleeve: c.shirt, pants: c.pants, shoe: c.shoe, skin: c.skin, hair: c.hair, legs: [0.84, 0.84] });
    person.group.position.fromArray(hips);
    body.add(person.group);
    person.torso.rotation.x = -0.5;
    addBox(0.2, 0.1, 0.05, makeMaterial(c.tie), person.torso, 0, 1.1, -0.29);
    const tie = addMesh(new THREE.CylinderGeometry(0.11, 0.06, 0.66, 4), makeMaterial(c.tie), person.torso, 0, 0.72, -0.3);
    tie.rotation.y = Math.PI / 4;
    tie.scale.z = 0.3;
    const collar = makeMaterial(c.shirt);
    [-1, 1].forEach(function (side) { addBox(0.2, 0.1, 0.1, collar, person.torso, side * 0.16, 1.2, -0.25).rotation.z = side * 0.4; });
    addBox(0.8, 0.09, 0.56, makeMaterial(c.belt), person.torso, 0, 0.26, 0);
    [0, 1].forEach(function (i) {
      person.arms[i].top.rotation.set(1.2, 0, (i ? 1 : -1) * 0.12);
      person.arms[i].low.rotation.x = 0.5;
    });
    let angle = 0;
    this.addRide('bike', {
      root: root, body: body, steerGroups: [fork], spinGroups: [frontSpin, rearSpin],
      spec: { skidWidth: 0.05, frontAxle: 1.14, noseLength: 2, tailLength: 2, halfWidth: 0.1 },
      animate: function (dt, s) {
        const speed = Math.abs(s.forwardSpeed);
        if (input.forward || speed > 2) angle += dt * Math.min(speed * 0.62 + 1.6, 15) * (s.forwardSpeed < -0.3 ? -1 : 1);
        crank.rotation.x = angle;
        pedals.forEach(function (pedal) { pedal.rotation.x = -angle; });
        [0, 1].forEach(function (i) {
          const side = i ? 1 : -1, footY = bb[1] + Math.cos(angle) * side * 0.38, footZ = bb[2] - Math.sin(angle) * side * 0.38;
          reach(person.legs[i], footY - hips[1] + 0.12, footZ - hips[2], 0.84, 0.84);
        });
        person.group.position.y = hips[1] + Math.min(speed / 10, 1) * 0.015 * Math.sin(angle * 2);
        person.torso.rotation.z = Math.min(speed / 10, 1) * 0.035 * Math.sin(angle);
      }
    });
  },

  setCar: function (name) {
    const car = this.cars[name];
    Object.keys(this.cars).forEach(function (key) {
      this.cars[key].root.visible = key === name;
      this.cars[key].root.scale.setScalar(1);
    }, this);
    this.carName = name;
    this.bodyGroup = car.body;
    this.steerGroups = car.steerGroups;
    this.spinGroups = car.spinGroups;
    this.brakeLight = car.brakeLight;
    this.flames = car.flames;
    this.spec = car.spec;
  },

  // 차종이 바뀔 때는 연기가 펑 하고 터지고, 연기 속에서 차가 바뀝니다.
  swapCar: function (name) {
    if (name === this.carName && !this.morph.active) return;
    Object.assign(this.morph, { active: true, swapped: false, time: 0, to: name });
    this.poof(this.state.x, this.state.z);
  },

  // 연기가 차를 가리는 순간 차종이 바뀌고, 차가 살짝 움츠렸다가 튀어나옵니다.
  updateMorph: function (dt) {
    const morph = this.morph;
    if (!morph.active) return;
    morph.time += dt;
    const t = morph.time / morph.length;
    if (!morph.swapped && t >= 0.3) {
      morph.swapped = true;
      this.setCar(morph.to);
    }
    const pop = 1 + Math.sin(Math.min(t, 1) * Math.PI) * (t < 0.3 ? -0.14 : 0.08);
    this.cars[this.carName].root.scale.setScalar(pop);
    if (t >= 1) {
      morph.active = false;
      this.cars[this.carName].root.scale.setScalar(1);
    }
  },

buildEffects: function () {
    const scene = this.el.sceneEl.object3D;
    // 타이어 자국
    const skidGeometry = new THREE.PlaneGeometry(0.46, 0.8);
    skidGeometry.rotateX(-Math.PI / 2);
    this.skids = new THREE.InstancedMesh(skidGeometry, new THREE.MeshBasicMaterial({ color: '#0b0e36', transparent: true, opacity: 0.42, depthWrite: false }), 900);
    this.skids.frustumCulled = false;
    this.skids.count = 0;
    this.skidIndex = 0;
    this.skidsFilled = 0;
    scene.add(this.skids);
    // 연기와 배기 입자
    this.puffs = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.5, 0), new THREE.MeshBasicMaterial({ color: '#e7e9ff', transparent: true, opacity: 0.55 }), 200);
    this.puffs.frustumCulled = false;
    this.puffData = [];
    for (let i = 0; i < 200; i++) this.puffData.push({ life: 0, max: 1, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, size: 1, drag: 0 });
    this.puffIndex = 0;
    scene.add(this.puffs);
    this.helper = new THREE.Object3D();
  },

  spawnPuff: function (x, y, z, vx, vz, size) {
    const p = this.puffData[this.puffIndex];
    this.puffIndex = (this.puffIndex + 1) % this.puffData.length;
    Object.assign(p, { life: 0.55, max: 0.55, x: x, y: y, z: z, vx: vx + (Math.random() - 0.5) * 2, vy: 1.4, vz: vz + (Math.random() - 0.5) * 2, size: size, drag: 0 });
  },
  // 차가 바뀔 때 "펑" 하고 터지는 연기: 사방으로 퍼졌다가 빠르게 느려지며 떠오릅니다.
  poof: function (x, z) {
    for (let i = 0; i < 34; i++) {
      const p = this.puffData[this.puffIndex], angle = Math.random() * Math.PI * 2, speed = 5 + Math.random() * 7, life = 0.75 + Math.random() * 0.5;
      this.puffIndex = (this.puffIndex + 1) % this.puffData.length;
      Object.assign(p, {
        life: life, max: life, x: x + Math.cos(angle) * 0.8, y: 0.3 + Math.random() * 1.4, z: z + Math.sin(angle) * 0.8,
        vx: Math.cos(angle) * speed, vy: 1.2 + Math.random() * 2.6, vz: Math.sin(angle) * speed, size: 2.2 + Math.random() * 1.8, drag: 4.5
      });
    }
  },

  stepPhysics: function (h) {
    const s = this.state, c = TUNE.car(this.spec.car), sus = this.spec.suspension;
    s.prevX = s.x;
    s.prevZ = s.z;
    s.prevHeading = s.heading;
    const sin = Math.sin(s.heading), cos = Math.cos(s.heading);
    const fx = -sin, fz = -cos, rx = cos, rz = -sin;
    let vf = s.vx * fx + s.vz * fz;
    let vr = s.vx * rx + s.vz * rz;
    const before = vf;

    s.hardBraking = input.brake && Math.abs(vf) > 0.4;
    s.boosting = input.boost && input.forward && !input.brake && !input.back;
    let accel = 0;
    const bothPedals = input.forward && input.back && !input.brake;
    if (input.brake) {
      accel = -Math.sign(vf) * Math.min(c.hardBrake, Math.abs(vf) / h);
    } else if (bothPedals) {
      accel = -Math.sign(vf) * Math.min(c.brake, Math.abs(vf) / h);
    } else if (input.forward && !input.back) {
      if (vf < -0.5) accel = c.brake;
      else {
        const top = s.boosting ? c.boostSpeed : c.topSpeed;
        const power = s.boosting ? c.boostAcceleration : c.acceleration;
        accel = vf > top ? -c.drag * (vf - top) * 2 : power * (1 - vf / top);
      }
    } else if (input.back && !input.forward) {
      if (vf > 0.5) accel = -Math.min(c.brake, vf / h);
      else accel = -c.acceleration * 0.6 * (1 + vf / c.reverseSpeed);
    } else {
      accel = -vf * c.drag - Math.sign(vf) * Math.min(0.9, Math.abs(vf) / h);
    }
    vf += accel * h;

    const steerTarget = (input.left ? 1 : 0) - (input.right ? 1 : 0);
    s.steer += (steerTarget - s.steer) * (1 - Math.exp(-h * (steerTarget ? 8 : 11)));
    const ratio = Math.min(Math.abs(vf) / c.topSpeed, 1);
    const steerLimit = c.steerLow + (c.steerHigh - c.steerLow) * Math.pow(ratio, 0.75);
    const yawRate = vf * Math.tan(s.steer * steerLimit) / c.wheelbase;
    s.heading += yawRate * h;

    vr *= Math.exp(-(input.brake ? c.brakeGrip : c.grip) * h);
    s.vx = fx * vf + rx * vr;
    s.vz = fz * vf + rz * vr;
    s.forwardSpeed = vf;
    s.slip = Math.abs(vr);
    s.aLong = (vf - before) / h;
    s.aLat = vf * yawRate;
    s.x += s.vx * h;
    s.z += s.vz * h;

    // 번아웃: 차가 멈추면 뒷바퀴만 헛돌고, A/D로 앞바퀴 축을 중심으로 뒤쪽을 천천히 돌립니다.
    s.burnout = bothPedals && Math.abs(vf) < 1;
    const burn = CONFIG.burnout, pivotTarget = s.burnout ? ((input.left ? 1 : 0) - (input.right ? 1 : 0)) * burn.pivotSpeed : 0;
    s.pivotRate += (pivotTarget - s.pivotRate) * (1 - Math.exp(-burn.pivotEase * h));
    if (!s.burnout) s.pivotRate = 0;
    if (s.pivotRate !== 0) {
      const axle = this.spec.frontAxle;
      const frontX = s.x - Math.sin(s.heading) * axle, frontZ = s.z - Math.cos(s.heading) * axle;
      s.heading += s.pivotRate * h;
      s.x = frontX + Math.sin(s.heading) * axle;
      s.z = frontZ + Math.cos(s.heading) * axle;
    }

    // 차체 스프링: 가속도가 목표 기울기가 되고, 차체는 스프링처럼 뒤따라갑니다.
    const pitchTarget = s.burnout ? burn.squat : THREE.MathUtils.clamp(s.aLong * sus.pitchPerAccel, -sus.maxPitchDown, sus.maxPitchUp);
    const rollTarget = THREE.MathUtils.clamp(-s.aLat * sus.rollPerAccel, -sus.maxRoll, sus.maxRoll);
    const heaveTarget = -Math.min(0.09, Math.abs(s.aLong) * sus.heavePerAccel);
    s.pitchV += (sus.stiffness * (pitchTarget - s.pitch) - sus.damping * s.pitchV) * h;
    s.rollV += (sus.stiffness * (rollTarget - s.roll) - sus.damping * s.rollV) * h;
    s.heaveV += (sus.stiffness * (heaveTarget - s.heave) - sus.damping * s.heaveV) * h;
    s.pitch += s.pitchV * h;
    s.roll += s.rollV * h;
    s.heave += s.heaveV * h;
    // 고속에서 바퀴가 역회전처럼 깜박이지 않도록 보이는 회전 속도에 상한을 둡니다.
    const rollingSpin = input.brake ? 0 : -THREE.MathUtils.clamp(vf / 0.4, -26, 26) * h;
    s.wheelSpin += rollingSpin;
    s.rearSpin += s.burnout ? -burn.spin * h : rollingSpin;
  },

  collide: function () {
    const s = this.state, b = WORLD.bounds;
    const limit = s.x > 0 ? WORLD.east : b;
    if (Math.abs(s.x) > limit) { s.x = Math.sign(s.x) * limit; s.vx *= -0.45; s.pitchV -= 0.5; }
    if (Math.abs(s.z) > b) { s.z = Math.sign(s.z) * b; s.vz *= -0.45; s.pitchV -= 0.5; }
    WORLD.statics.forEach(function (o) {
      const dx = s.x - o.x, dz = s.z - o.z, d = Math.hypot(dx, dz), min = 1.6 + o.r;
      if (d >= min || d === 0) return;
      const nx = dx / d, nz = dz / d;
      s.x = o.x + nx * min;
      s.z = o.z + nz * min;
      const into = s.vx * nx + s.vz * nz;
      // 스튜디오 음향 장비를 들이받으면 그 장비의 EQ가 켜집니다.
      if (o.gear !== undefined && into < -CONFIG.music.gears.hitSpeed) WORLD.hitGear(o.gear);
      if (into < 0) {
        s.vx -= nx * into * 1.35;
        s.vz -= nz * into * 1.35;
        s.pitchV += into * 0.09;
        s.rollV += (s.vx * nz - s.vz * nx) * 0.02;
      }
    });
    const fx = -Math.sin(s.heading), fz = -Math.cos(s.heading);
    WORLD.props.forEach(function (p) {
      if (p.y > 1.4) return;
      [1.35, -1.35].forEach(function (offset) {
        const dx = p.x - (s.x + fx * offset), dz = p.z - (s.z + fz * offset);
        const d = Math.hypot(dx, dz) || 0.001, min = 0.95 + p.r;
        if (d >= min) return;
        const nx = dx / d, nz = dz / d;
        p.x += nx * (min - d);
        p.z += nz * (min - d);
        const closing = (s.vx - p.vx) * nx + (s.vz - p.vz) * nz;
        if (closing <= 0) return;
        const impulse = closing * 1.35;
        p.vx += nx * impulse;
        p.vz += nz * impulse;
        p.vy = Math.max(p.vy, Math.min(closing * 0.3, 9));
        p.spinX = (Math.random() - 0.5) * closing * 0.8;
        p.spinZ = (Math.random() - 0.5) * closing * 0.8;
        s.vx -= nx * impulse * p.mass * 0.03;
        s.vz -= nz * impulse * p.mass * 0.03;
        WORLD.wake(p);
      });
    });
  },

  updateProps: function (dt) {
    const gravity = 24, props = WORLD.props;
    props.forEach(function (p) {
      if (p.asleep) return;
      p.vy -= gravity * dt;
      p.x += p.vx * dt;
      p.z += p.vz * dt;
      p.y += p.vy * dt;
      const onGround = p.y <= 0;
      if (onGround) { p.y = 0; p.vy = Math.abs(p.vy) > 2 ? -p.vy * 0.28 : 0; }
      const friction = Math.exp(-(onGround ? 3.4 : 0.25) * dt);
      p.vx *= friction;
      p.vz *= friction;
      p.spinX *= friction;
      p.spinZ *= friction;
      p.obj.rotation.x += p.spinX * dt;
      p.obj.rotation.z += p.spinZ * dt;
      const speed = Math.hypot(p.vx, p.vz);
      if (onGround && speed < 2.2) {
        // 멈출 때는 가까운 면으로 눕거나 서도록 정렬합니다.
        const q = Math.PI / 2;
        p.obj.rotation.x += (Math.round(p.obj.rotation.x / q) * q - p.obj.rotation.x) * Math.min(1, dt * 7);
        p.obj.rotation.z += (Math.round(p.obj.rotation.z / q) * q - p.obj.rotation.z) * Math.min(1, dt * 7);
      }
      props.forEach(function (o) {
        if (o === p || Math.abs(o.y - p.y) > 1) return;
        const dx = o.x - p.x, dz = o.z - p.z, d = Math.hypot(dx, dz) || 0.001, min = o.r + p.r;
        if (d >= min) return;
        const nx = dx / d, nz = dz / d;
        p.x -= nx * (min - d) * 0.5; p.z -= nz * (min - d) * 0.5;
        o.x += nx * (min - d) * 0.5; o.z += nz * (min - d) * 0.5;
        const closing = (p.vx - o.vx) * nx + (p.vz - o.vz) * nz;
        if (closing > 0) {
          p.vx -= nx * closing * 0.7; p.vz -= nz * closing * 0.7;
          o.vx += nx * closing * 0.7; o.vz += nz * closing * 0.7;
          WORLD.wake(o);
        }
      });
      p.obj.position.set(p.x, p.y + p.baseY, p.z);
    });
  },

  stampSkids: function () {
    const s = this.state;
    const skidding = s.burnout || (s.hardBraking && Math.abs(s.forwardSpeed) > 3) || s.slip > 2.6;
    if (!skidding) { s.lastStamp = null; return; }
    const fx = -Math.sin(s.heading), fz = -Math.cos(s.heading), rx = -fz, rz = fx;
    const cx = s.x - fx * 1.5, cz = s.z - fz * 1.5;
    if (s.lastStamp && Math.hypot(cx - s.lastStamp.x, cz - s.lastStamp.z) < 0.7) return;
    const helper = this.helper, self = this;
    [-self.spec.skidWidth, self.spec.skidWidth].forEach(function (side) {
      helper.position.set(cx + rx * side, 0.07, cz + rz * side);
      helper.rotation.set(0, s.heading, 0);
      helper.updateMatrix();
      self.skids.setMatrixAt(self.skidIndex, helper.matrix);
      self.skidIndex = (self.skidIndex + 1) % 900;
      self.skidsFilled = Math.min(900, self.skidsFilled + 1);
    });
    this.skids.count = this.skidsFilled;
    this.skids.instanceMatrix.needsUpdate = true;
    s.lastStamp = { x: cx, z: cz };
  },

  updatePuffs: function (dt) {
    const s = this.state, helper = this.helper;
    const fx = -Math.sin(s.heading), fz = -Math.cos(s.heading);
    if (s.hardBraking && Math.abs(s.forwardSpeed) > 4 && Math.random() < 0.6) {
      this.spawnPuff(s.x - fx * 1.6, 0.3, s.z - fz * 1.6, s.vx * 0.3, s.vz * 0.3, 1.1);
    }
    if (s.burnout) {
      const side = this.spec.skidWidth, sideX = -fz * side, sideZ = fx * side;
      for (let wheel = -1; wheel <= 1; wheel += 2) {
        if (Math.random() < 0.8) this.spawnPuff(s.x - fx * 1.5 + sideX * wheel, 0.3, s.z - fz * 1.5 + sideZ * wheel, -fx * 2.5, -fz * 2.5, 1.5);
      }
    }
    if (s.boosting && Math.random() < 0.35) {
      this.spawnPuff(s.x - fx * 3.2, 0.7, s.z - fz * 3.2, s.vx * 0.2, s.vz * 0.2, 0.55);
    }
    for (let i = 0; i < this.puffData.length; i++) {
      const p = this.puffData[i];
      if (p.life > 0) p.life -= dt;
      const t = Math.max(p.life, 0) / p.max;
      if (p.drag) {
        const slow = Math.exp(-p.drag * dt);
        p.vx *= slow;
        p.vz *= slow;
      }
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      helper.position.set(p.x, p.y, p.z);
      helper.rotation.set(t * 3, t * 5, 0);
      helper.scale.setScalar(t > 0 ? p.size * (0.4 + (1 - t) * 1.2) * Math.min(1, t * 3) : 0.0001);
      helper.updateMatrix();
      this.puffs.setMatrixAt(i, helper.matrix);
    }
    helper.scale.setScalar(1);
    this.puffs.instanceMatrix.needsUpdate = true;
  },

  startFuel: function () {
    const fuel = this.fuel, s = this.state;
    if (PIT.active) {
      PIT.exit();
      return;
    }
    if (WORLD.player.near || PIT.near) {
      s.vx = 0;
      s.vz = 0;
      if (PIT.near) PIT.enter(this);
      else playOriginal();
      return;
    }
    if (!fuel.near || fuel.active) return;
    fuel.active = true;
    fuel.progress = 0;
    fuel.doneTimer = 0;
    WORLD.locked = true;
    Object.keys(input).forEach(function (name) { setInput(name, false); });
    s.vx = 0;
    s.vz = 0;
    this.fuelDom.pad.classList.add('locked');
    this.fuelDom.title.textContent = '주유 중';
    const shot = CONFIG.fuel.glassShot;
    SHOT.set(WORLD.glass.x, shot[0], WORLD.glass.z, shot[1], shot[2], shot[3]);
  },

  // 주유기 근처 판정, 게이지 진행, 차량 위 창의 화면 위치를 처리합니다.
  updateFuel: function (dt) {
    const fuel = this.fuel, dom = this.fuelDom, s = this.state, rule = CONFIG.fuel;
    fuel.near = !fuel.active && Math.hypot(s.vx, s.vz) < rule.maxSpeed && WORLD.pumps.some(function (pump) {
      return Math.hypot(pump.x - s.x, pump.z - s.z) < rule.reach;
    });
    if (fuel.active) {
      fuel.progress = Math.min(1, fuel.progress + dt / rule.seconds);
      if (fuel.progress >= 1) {
        fuel.active = false;
        fuel.doneTimer = rule.carSeconds;
        dom.title.textContent = '주유 완료';
        // 잔에서 차로 카메라를 옮긴 뒤, 차가 바뀌는 순간을 가까이 비춥니다.
        const shot = rule.carShot;
        SHOT.set(s.x, shot[0], s.z, shot[1], shot[2], shot[3]);
        fuel.swapAt = rule.swapDelay;
      }
    } else if (fuel.doneTimer > 0) {
      fuel.doneTimer -= dt;
      if (fuel.swapAt > 0) {
        fuel.swapAt -= dt;
        if (fuel.swapAt <= 0 && this.carName !== 'gt') this.swapCar('gt');
      }
      if (fuel.doneTimer <= 0) {
        SHOT.release();
        WORLD.locked = false;
        dom.pad.classList.remove('locked');
      }
    }
    // 잔 속 칵테일: 주유하는 동안 줄어들고, 평소에는 천천히 다시 채워집니다.
    const glass = WORLD.glass;
    if (glass) {
      glass.level = fuel.active ? 1 - fuel.progress * 0.88 : Math.min(1, glass.level + dt * (fuel.doneTimer > 0 ? 0 : 0.12));
      glass.liquid.scale.y = Math.max(0.02, glass.level);
      glass.ice.position.y = Math.max(4.3, 7.8 - (1 - glass.level) * 6.6);
    }
    const showPanel = fuel.active || fuel.doneTimer > 0, hint = showPanel || WORLD.locked ? null : this.findHint();
    const showPrompt = !!hint;
    if (hint) {
      const touch = window.matchMedia('(pointer: coarse)').matches;
      const text = touch ? hint.action : hint.text || (hint.ready ? '' : hint.place + ' 멈춘 뒤 ') + 'F를 눌러 ' + hint.action;
      if (dom.prompt.textContent !== text) dom.prompt.textContent = text;
      dom.prompt.classList.toggle('waiting', !hint.ready);
    }
    dom.tag.hidden = !showPanel && !showPrompt;
    dom.panel.hidden = !showPanel;
    dom.prompt.hidden = !showPrompt;
    if (dom.tag.hidden) return;
    if (showPanel) {
      dom.fill.style.width = (fuel.progress * 100) + '%';
      dom.percent.textContent = Math.round(fuel.progress * 100) + '%';
    }
    const scene = this.el.sceneEl, canvas = scene.canvas;
    this.cameraEl.object3D.updateMatrixWorld(true);
    // 안내는 해당 오브젝트 위에, 주유 게이지는 차 위에 뜹니다. 화면 밖으로 나가지 않게 가장자리에서 멈춥니다.
    if (hint) this.tagPoint.set(hint.x, CONFIG.hints.height, hint.z);
    else if (fuel.active && WORLD.glass) this.tagPoint.set(WORLD.glass.x, 15.5, WORLD.glass.z);   // 주유 중에는 잔 위에
    else this.tagPoint.set(s.renderX, 3, s.renderZ);
    const point = this.tagPoint.project(scene.camera), width = canvas.clientWidth, height = canvas.clientHeight;
    const x = THREE.MathUtils.clamp((point.x + 1) / 2 * width, 130, width - 130), y = THREE.MathUtils.clamp((1 - point.y) / 2 * height, 56, height - 16);
    dom.tag.style.transform = 'translate(' + x + 'px, ' + y + 'px) translate(-50%, -100%)';
  },

  // 가까이 있는 F 상호작용을 찾습니다. ready는 지금 F를 누르면 바로 작동한다는 뜻입니다.
  findHint: function () {
    const s = this.state, h = CONFIG.hints;
    const close = function (spot, reach) { return Math.hypot(spot.x - s.x, spot.z - s.z) < reach; };
    if (close(WORLD.player, h.zoneReach)) return { x: WORLD.player.x, z: WORLD.player.z, ready: WORLD.player.near, place: '영역 안에', action: AUDIO.current < 0 ? '원곡 듣기' : AUDIO.paused ? '다시 재생하기' : '멈추기' };
    if (close(PIT, h.zoneReach)) return PIT.hint();
    const pump = WORLD.pumps.find(function (spot) { return close(spot, CONFIG.fuel.hintReach); });
    return pump ? { x: pump.x, z: pump.z, ready: this.fuel.near, place: '주유기 옆에', action: '주유하기' } : null;
  },

  // 구간에 들어가면 화면 위쪽에 환영 문구가 나타났다가 사라집니다.
  showZone: function (zone) {
    const label = this.zoneLabel;
    label.textContent = CONFIG.zones[zone];
    label.classList.toggle('ink', zone === 'music');
    label.classList.add('show');
    clearTimeout(this.zoneTimer);
    this.zoneTimer = setTimeout(function () { label.classList.remove('show'); }, 2800);
  },

  // 구간을 오갈 때 하늘, 안개, 빛을 그 구간의 값으로 서서히 바꿉니다.
  updateAtmosphere: function (dt) {
    const s = this.state, zone = zoneAt(s.x, s.z);
    if (zone !== this.zone) {
      this.zone = zone;
      if (zone) this.showZone(zone);
    }
    const moodName = zone === 'fashion' ? WORLD.fashion.theme || CONFIG.fashion.start : zone || 'day';
    const mood = this.mood, target = this.moods[moodName], k = 1 - Math.exp(-2.4 * dt);
    mood.fog.lerp(target.fog, k);
    mood.sky.lerp(target.sky, k);
    mood.ground.lerp(target.ground, k);
    mood.sun.lerp(target.sun, k);
    mood.near += (target.near - mood.near) * k;
    mood.far += (target.far - mood.far) * k;
    mood.hemi += (target.hemi - mood.hemi) * k;
    mood.sunPower += (target.sunPower - mood.sunPower) * k;
    const scene = this.el.sceneEl.object3D;
    const hemi = this.skyLight.getObject3D('light'), sun = this.sun.getObject3D('light');
    if (scene.fog) {
      const viewExtra = (WORLD.viewZoom - 1) * 34;   // 멀리 볼 때 안개가 화면을 덮지 않게 함께 밀어냅니다.
      scene.fog.color.copy(mood.fog);
      scene.fog.near = mood.near + viewExtra;
      scene.fog.far = mood.far + viewExtra;
    }
    if (scene.background && scene.background.isColor) scene.background.copy(mood.fog);
    if (hemi) {
      hemi.color.copy(mood.sky);
      hemi.groundColor.copy(mood.ground);
      hemi.intensity = mood.hemi;
    }
    if (sun) {
      sun.color.copy(mood.sun);
      sun.intensity = mood.sunPower;
    }
  },

  // 그림자 지도의 픽셀 격자에 맞춰 태양을 옮겨, 이동 중 그림자 가장자리가 떨리지 않게 합니다.
  updateSun: function (x, z) {
    const axes = this.sunAxes, p = this.sunPoint.set(x, 0, z), texel = 112 / 2048;
    const right = Math.round(p.dot(axes.right) / texel) * texel;
    const up = Math.round(p.dot(axes.up) / texel) * texel;
    const depth = p.dot(axes.back);
    p.copy(axes.right).multiplyScalar(right).addScaledVector(axes.up, up).addScaledVector(axes.back, depth);
    this.sunTarget.object3D.position.copy(p);
    this.sun.object3D.position.copy(p).add(axes.offset);
  },

  tick: function (time, dtMs) {
    const rawDt = Math.min(dtMs / 1000, 0.05), step = 1 / 120, s = this.state;
    // 브라우저가 알려주는 프레임 시간의 잔떨림을 걸러냅니다. 큰 변화는 바로 따라갑니다.
    this.smoothDt = Math.abs(rawDt - this.smoothDt) > 0.012 ? rawDt : this.smoothDt + (rawDt - this.smoothDt) * 0.12;
    const dt = this.smoothDt;
    this.accumulator += dt;
    while (this.accumulator >= step) {
      this.stepPhysics(step);
      this.accumulator -= step;
    }
    const beforeX = s.x, beforeZ = s.z;
    this.collide();
    s.prevX += s.x - beforeX;
    s.prevZ += s.z - beforeZ;
    this.updateProps(dt);
    this.stampSkids();
    this.updatePuffs(dt);

    // 물리 계산은 1/120초 단위라서, 화면에는 직전 두 계산 사이의 위치를 보간해 그립니다.
    const alpha = this.accumulator / step;
    s.renderX = s.prevX + (s.x - s.prevX) * alpha;
    s.renderZ = s.prevZ + (s.z - s.prevZ) * alpha;
    const renderHeading = s.prevHeading + (s.heading - s.prevHeading) * alpha;

    const root = this.el.object3D;
    root.position.set(s.renderX, 0, s.renderZ);
    root.rotation.y = renderHeading;
    // 범프 스톱: 스프링이 튕겨도 차체는 정해진 각도까지만 기울고, 끝부분이 지면에 닿으면 차체를 들어 올립니다.
    const spec = this.spec, sus = spec.suspension;
    const pitch = THREE.MathUtils.clamp(s.pitch, -sus.maxPitchDown * 1.15, sus.maxPitchUp * 1.15);
    const roll = THREE.MathUtils.clamp(s.roll, -sus.maxRoll * 1.15, sus.maxRoll * 1.15);
    const heave = Math.max(s.heave, -0.05);
    const side = Math.sin(Math.abs(roll)) * spec.halfWidth, floor = 0.03;
    const noseLow = spec.noseClear + heave - side - Math.sin(Math.max(-pitch, 0)) * spec.noseLength;
    const tailLow = spec.tailClear + heave - side - Math.sin(Math.max(pitch, 0)) * spec.tailLength;
    this.bodyGroup.rotation.x = pitch;
    this.bodyGroup.rotation.z = roll;
    this.bodyGroup.position.y = heave + Math.max(0, floor - noseLow, floor - tailLow);
    const visualSteer = s.steer * 0.42;
    this.steerGroups.forEach(function (group) { group.rotation.y = visualSteer; });
    this.spinGroups.forEach(function (group, index) { group.rotation.x = index < 2 ? s.wheelSpin : s.rearSpin; });
    const ride = this.cars[this.carName];
    if (ride.animate) ride.animate(dt, s);

    this.brakeLight.emissiveIntensity = input.brake || (input.back && s.forwardSpeed > 0.5) ? 5 : 0;
    TUNE.flame(this.flames, s.boosting || PIT.flare > 0, time);

    this.updateSun(s.renderX, s.renderZ);
    this.updateAtmosphere(dt);
    updateMusic(dt, s);
    updateFaders(dt);
    updateFashion(dt, s);
    updatePit(dt, s, this);
    KEY_GUIDE.update(this);
    BGM.update(dt);
    INTRO.update(dt, s.renderX, s.renderZ, this);

    // 카메라는 차를 그린 직후 같은 프레임에 움직여야 차가 화면에서 떨리지 않습니다.
    const follow = this.cameraEl.components['follow-cam'];
    if (follow) follow.follow(time, dt);
    updatePitPops(dt, s, this.el.sceneEl.camera, this.el.sceneEl.canvas);
    this.updateFuel(dt);
    this.updateMorph(dt);

    this.hudTimer += dt;
  }
});

/* ---------- 전지적 고정 시점 카메라: 회전하지 않고 차를 따라 이동합니다 ---------- */
AFRAME.registerComponent('follow-cam', {
  schema: { target: { type: 'selector' } },
  init: function () {
    this.leadX = 0;
    this.leadZ = 0;
    this.offset = new THREE.Vector3().fromArray(CONFIG.camera.offset);
    this.offsetGoal = new THREE.Vector3();
    this.tilt = new THREE.Matrix4();
    this.origin = new THREE.Vector3();
    this.up = new THREE.Vector3(0, 1, 0);
    this.zoom = 1;
    this.userZoom = 1;
    this.ready = false;
    this.calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const matrix = new THREE.Matrix4().lookAt(this.offset, new THREE.Vector3(), new THREE.Vector3(0, 1, 0));
    this.el.object3D.quaternion.setFromRotationMatrix(matrix);
  },
  // f1-car가 매 프레임 끝에서 호출합니다. 평소에는 고정된 각도로 차를 따라가고,
  // 피트에서는 차 둘레를 도는 시점(PIT.yaw, PIT.pitch)으로 다가갑니다. 두 시점 사이는 orbit 값으로 섞습니다.
  follow: function (time, dt) {
    const car = this.data.target.components['f1-car'];
    if (!car) return;
    const s = car.state, cam = CONFIG.camera, pit = CONFIG.pit;
    const blend = this.ready ? 1 - Math.exp(-cam.smoothing * dt) : 1;
    if (!this.ready) {
      this.baseYaw = Math.atan2(this.offset.x, this.offset.z);
      this.basePitch = Math.atan2(this.offset.y, Math.hypot(this.offset.x, this.offset.z));
      this.baseLength = this.offset.length();
      this.orbit = 0;
      this.target = new THREE.Vector3();
    }
    this.ready = true;
    const aspect = this.el.sceneEl.canvas ? this.el.sceneEl.canvas.clientWidth / Math.max(this.el.sceneEl.canvas.clientHeight, 1) : 1.6;
    const portrait = aspect < 1 ? 1 / Math.max(aspect, 0.55) * 0.8 : 1;
    const speedRatio = Math.min(Math.abs(s.forwardSpeed) / car.spec.car.boostSpeed, 1);
    this.leadX += (s.vx * cam.lookAhead - this.leadX) * blend;
    this.leadZ += (s.vz * cam.lookAhead - this.leadZ) * blend;
    this.zoom += ((1 + speedRatio * cam.speedZoom) * portrait - this.zoom) * blend;
    this.userZoom += (WORLD.viewZoom - this.userZoom) * (1 - Math.exp(-9 * dt));
    // 피트 시점으로 들어가고 나오는 정도. 들어갈 때는 부드럽게 가속하고 감속합니다.
    this.orbit += THREE.MathUtils.clamp((PIT.active ? 1 : 0) - this.orbit, -dt * 1.4, dt * 1.4);
    const w = this.calm ? (PIT.active ? 1 : 0) : THREE.MathUtils.smootherstep(this.orbit, 0, 1);
    const turn = 1 - Math.exp(-14 * dt);
    PIT.view.yaw += (PIT.yaw - PIT.view.yaw) * turn;
    PIT.view.pitch += (PIT.pitch - PIT.view.pitch) * turn;
    let yaw = this.baseYaw + (PIT.view.yaw - this.baseYaw) * w;
    let pitch = this.basePitch + (PIT.view.pitch - this.basePitch) * w;
    let radius = this.baseLength * this.zoom * this.userZoom * (1 - w) + pit.viewRadius * portrait * w;
    // 피트에서는 우측 업그레이드 창에 가리지 않도록 차를 화면 왼쪽으로 조금 비켜 둡니다.
    const aside = aspect > 1.2 ? radius * pit.viewAside * w : 0;
    this.target.set(s.renderX + this.leadX * (1 - w) + Math.cos(yaw) * aside, pit.viewLift * w, s.renderZ + this.leadZ * (1 - w) - Math.sin(yaw) * aside);
    // 카메라 연출(SHOT): 지금 시점에서 연출 지점으로 천천히 옮겨 가고, 풀리면 되돌아옵니다.
    const shot = this.shot || (this.shot = { w: 0, x: 0, y: 0, z: 0, yaw: 0, pitch: 0, radius: 0 });
    if (SHOT.active && shot.w === 0) Object.assign(shot, { x: SHOT.x, y: SHOT.y, z: SHOT.z, yaw: SHOT.yaw, pitch: SHOT.pitch, radius: SHOT.radius });
    const follow = 1 - Math.exp(-2.6 * dt);
    ['x', 'y', 'z', 'yaw', 'pitch', 'radius'].forEach(function (key) { shot[key] += (SHOT[key] - shot[key]) * follow; });
    shot.w = THREE.MathUtils.clamp(shot.w + (SHOT.active ? dt : -dt) / 1.2, 0, 1);
    const ws = this.calm ? (SHOT.active ? 1 : 0) : THREE.MathUtils.smootherstep(shot.w, 0, 1);
    if (ws > 0) {
      yaw += (shot.yaw - yaw) * ws;
      pitch += (shot.pitch - pitch) * ws;
      radius += (shot.radius * portrait - radius) * ws;
      this.target.set(this.target.x + (shot.x - this.target.x) * ws, this.target.y + (shot.y - this.target.y) * ws, this.target.z + (shot.z - this.target.z) * ws);
    }
    const camera = this.el.object3D;
    camera.position.set(
      this.target.x + Math.sin(yaw) * Math.cos(pitch) * radius,
      this.target.y + Math.sin(pitch) * radius,
      this.target.z + Math.cos(yaw) * Math.cos(pitch) * radius
    );
    this.tilt.lookAt(camera.position, this.target, this.up);
    camera.quaternion.setFromRotationMatrix(this.tilt);
    // 부스터의 진동은 난수 대신 느린 파형으로 만들어 프레임마다 튀지 않습니다.
    const sway = s.boosting && !this.calm ? 0.035 : 0;
    camera.position.x += Math.sin(time * 0.019) * sway;
    camera.position.y += Math.sin(time * 0.027) * sway;
  }
});

/* ---------- 카메라 연출: 정해 둔 지점을 정해 둔 각도에서 바라봅니다. 풀면 원래 시점으로 돌아옵니다 ---------- */
const SHOT = {
  active: false, x: 0, y: 0, z: 0, yaw: 0, pitch: 0, radius: 0,
  // yaw는 고정 시점 각도에서 더할 값입니다.
  set: function (x, y, z, yaw, pitch, radius) {
    Object.assign(this, { active: true, x: x, y: y, z: z, yaw: Math.atan2(CONFIG.camera.offset[0], CONFIG.camera.offset[2]) + yaw, pitch: pitch, radius: radius });
  },
  release: function () { this.active = false; }
};

/* ---------- 파우스트 구간의 소품 ---------- */
// 글자 윤곽을 그대로 돌출시켜 트랙 위 입체 글씨와 주유소를 가리키는 화살표를 만듭니다.

// ROAD_TEXT의 줄들을 돌출시켜 고정 카메라와 수평으로 눕힙니다. 줄 번호는 ROAD_TEXT.lines의 순서입니다.
function layText(root, rows, x, z, width, lineGap, material) {
  const widest = Math.max.apply(null, rows.map(function (row) { return ROAD_TEXT.lines[row].w; }));
  const scale = width / widest, shapes = [];
  rows.forEach(function (row, index) {
    const line = ROAD_TEXT.lines[row], left = -line.w * scale / 2;
    const baseline = -(index - (rows.length - 1) / 2) * lineGap;
    line.g.forEach(function (item) {
      const path = new THREE.ShapePath();
      const px = function (v) { return left + (item[1] + v) * scale; }, py = function (v) { return baseline + v * scale; };
      ROAD_TEXT.glyphs[item[0]].split(' ').forEach(function (command) {
        const type = command[0], v = command.slice(1).split(',').map(Number);
        if (type === 'M') path.moveTo(px(v[0]), py(v[1]));
        if (type === 'L') path.lineTo(px(v[0]), py(v[1]));
        if (type === 'Q') path.quadraticCurveTo(px(v[0]), py(v[1]), px(v[2]), py(v[3]));
        if (type === 'C') path.bezierCurveTo(px(v[0]), py(v[1]), px(v[2]), py(v[3]), px(v[4]), py(v[5]));
      });
      Array.prototype.push.apply(shapes, path.toShapes(true));   // CFF 글꼴은 바깥 윤곽이 반시계 방향입니다.
    });
  });
  const group = new THREE.Group();
  group.position.set(x, 0.05, z);
  group.rotation.y = Math.atan2(CONFIG.camera.offset[0], CONFIG.camera.offset[2]);
  root.add(group);
  // 바닥에 칠한 듯 납작하게 깝니다. 입체 글씨는 원근 때문에 읽기 어려웠습니다.
  addMesh(new THREE.ShapeGeometry(shapes, 6), material, group, 0, 0.12, 0).rotation.x = -Math.PI / 2;
}

// 시작점에서 끝점을 가리키는 납작한 입체 화살표
function layArrow(root, fromX, fromZ, toX, toZ, shaft, head, material) {
  const length = Math.hypot(toX - fromX, toZ - fromZ), ux = (toX - fromX) / length, uz = (toZ - fromZ) / length;
  const neck = length - head * 1.5, side = function (along, across) {
    return [fromX + ux * along - uz * across, -(fromZ + uz * along + ux * across)];
  };
  const outline = [side(0, -shaft), side(neck, -shaft), side(neck, -head), side(length, 0), side(neck, head), side(neck, shaft), side(0, shaft)];
  const arrow = new THREE.Shape();
  outline.forEach(function (point, index) {
    if (index) arrow.lineTo(point[0], point[1]);
    else arrow.moveTo(point[0], point[1]);
  });
  arrow.closePath();
  addMesh(new THREE.ShapeGeometry(arrow), material, root, 0, 0.17, 0).rotation.x = -Math.PI / 2;
}

function buildRoadText(root) {
  const white = makeMaterial('#ffffff', { emissive: '#ffffff', emissiveIntensity: 0.28 });
  layText(root, [0, 1, 2], -64, 71.4, 27, 3.6, white);

}

function textTexture(text, width, height, background, foreground, font) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = background;
  ctx.fillRect(0, 0, width, height);
  ctx.fillStyle = foreground;
  ctx.font = font;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, width / 2, height / 2);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}
function lathe(profile, segments) {
  return new THREE.LatheGeometry(profile.map(function (p) { return new THREE.Vector2(p[0], p[1]); }), segments);
}

function buildFaust(root, points, normals, samples) {
